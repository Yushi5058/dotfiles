# remap prefix from 'C-b' to 'C-x'
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g detach-on-destroy off
set-option -g renumber-windows on
set -s escape-time 1
set -g history-limit 100000
# Copy every tmux selection to the system clipboard, matching Ghostty's
# copy-on-select behaviour. Mouse selections also pipe straight to wl-copy
# (copy-command below), so they work even if OSC52 is unavailable.
set -g set-clipboard on
# Declare the OSC52 capability for ghostty so copy-mode selections can use it.
set -g terminal-features 'xterm-ghostty:clipboard'
set -g default-terminal "${TERM}"
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
setw -g aggressive-resize on

# Off: passthrough would let any app emit OSC52 straight to the terminal,
# bypassing tmux's own clipboard handling. Image protocols that need it can be
# enabled per-session with `tmux set -g allow-passthrough on`.
set -g allow-passthrough off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM





# set vi-mode
set -g mode-keys vi
set -g status-keys vi

# omo setup
set -g extended-keys on
set -g extended-keys-format csi-u


# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# split panes using v and b
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file "$HOME/.config/tmux/tmux.conf"

# Streaming guard: prefix + C-l wipes this pane's scrollback and clears the
# system clipboard, so a pane that printed a secret can be scrubbed instantly.
bind C-l clear-history \; run-shell 'command -v wl-copy >/dev/null && wl-copy --clear'


# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# tmux's default mouse drag/double/triple click handlers end in
# `copy-pipe-and-cancel` with no argument. Point that at wl-copy so every
# mouse selection lands in the system clipboard even without OSC52.
set -g copy-command 'wl-copy'



# set status-bar position
set -g status-position bottom

 #  fix color issue
set -ga terminal-overrides ",*256col*:Tc"
set -g default-terminal "screen-256color"


# Navigation 
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Both copy-mode keys copy to the tmux buffer and the system clipboard.
# `copy-pipe-and-cancel` without an argument uses copy-command (wl-copy).
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Explicit clipboard copy for mouse selections / past copies. tmux-yank is
# declared below but may not be installed; this keeps `prefix y` working.
bind y run-shell 'tmux show-buffer | wl-copy'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# list of plugin

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect' # restore with Ctrl+r
# Restore pane contents: off, so scrollback that printed a secret is not
# written to ~/.local/share/tmux/resurrect/
set -g @resurrect-capture-pane-contents 'off'

# Restore specific programs (e.g., vim, nvim, man, tail)
set -g @resurrect-processes 'ssh nvim vim man tail top htop btop'
set -g @plugin 'tmux-plugins/tmux-continuum' # continuous saving
set -g @plugin 'tmux-plugins/tmux-yank' # prefix + y
set -g @plugin 'sainnhe/tmux-fzf' # fzf with prefix+F
set -g @plugin 'fcsonline/tmux-thumbs' # copypaste like vimium
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' #highlight prefix
set -g @plugin 'nordtheme/tmux' # nord theme

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Nord status bar
set -g status-style 'bg=#2e3440,fg=#d8dee9'
set -g status-left '#[bg=#5e81ac,fg=#eceff4,bold] #S #[bg=#2e3440,fg=#d8dee9] '

setw -g window-status-current-style 'bg=#3b4252,fg=#88c0d0,bold'
setw -g window-status-style 'fg=#d8dee9'

run '~/.tmux/plugins/tpm/tpm'

# load tpm before theme configuration

# It can be any of the on tmux (named colors, 256-color set, `default` or hex colors)
# See more on http://man.openbsd.org/OpenBSD-current/man1/tmux.1#STYLES



# Example values for these can be:

# These are not padded

# Very beta and specific opt-in settings, tested on v3.2a, look at issue #10

# change statusline
set -g status-right '#{prefix_highlight}'
# tmux-continuum & tmux-resurrect
set -g @continuum-restore 'on'
# no pane contents on disk: scrollback may hold secrets
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'


