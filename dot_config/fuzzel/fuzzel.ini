# Fuzzel - Nord Theme
font=Maple Mono:size=12
prompt=>
icon-theme=Tela-circle-blue-dark
terminal=ghostty
lines=15
width=30
horizontal-pad=5

# Smart fuzzy search: fzf-style scoring (best match first) instead of wofi's
# unranked subsequence match.
match-mode=fzf
# Sort by launch count from the cache (~/.cache/fuzzel) so the apps you
# actually use bubble to the top. Disabling this ignores the cache entirely.
sort-result=yes

[colors]
# bg: #2e3440 | fgd: #d8dee9 | cya: #88c0d0 | blu: #5e81ac | red: #bf616a
background=2e3440ff
text=d8dee9ff
match=88c0d0ff
selection=5e81acff
selection-text=eceff4ff
selection-match=88c0d0ff
border=88c0d0ff

[border]
width=3
radius=6
