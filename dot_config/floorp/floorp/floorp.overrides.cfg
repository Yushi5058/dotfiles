// Floorp overrides — performance + usability (less hardened than LibreWolf)
// i5-1145G7 / 16GB RAM / Iris Xe
//
// REFERENCE ONLY — Floorp 156 ignores this file:
//   - ~/.config/floorp/floorp/ is not a cfg load path
//   - Floorp 12+ dropped the autoconfig/overrides.cfg loader entirely
//   Live prefs live in ~/.floorp/<active-profile>/user.js (persisted via user.js,
//   survives default-pref changes). Prefs below were converted 1:1 — keep this
//   file and user.js in sync.

// ── Performance ──
defaultPref("dom.ipc.processCount", 6);
defaultPref("browser.tabs.unloadOnLowMemory", false);
defaultPref("browser.cache.memory.capacity", 1048576);
defaultPref("image.mem.surfacecache_max_size_kb", 524288);
defaultPref("browser.cache.disk.capacity", 358400);
defaultPref("browser.sessionhistory.max_entries", 20);
defaultPref("browser.contentSettings.cache.enabled", false);
defaultPref("dom.serviceWorkers.parentInterception", false);
defaultPref("media.autoplay.default", 1);           // Allow autoplay (0=block, 1=allow, 5=block audio)
defaultPref("general.smoothScroll", true);          // Keep smooth scroll

// ── Hardware video decode (VA-API / Iris Xe) ──
// Floorp has better VA-API defaults; enable safely
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.ffmpeg.vaapi.enabled", true);
// AV1: Tiger Lake has NO hw AV1 → force false to get VP9/H264
defaultPref("media.av1.enabled", false);

// ── WebGL / Canvas — keep working (no RFP breakage) ──
defaultPref("webgl.force-enabled", true);
defaultPref("webgl.enable-webgl2", true);
// ResistFingerprinting OFF — Floorp less aggressive
defaultPref("privacy.resistFingerprinting", false);

// ── Session Restore ──
defaultPref("browser.sessionstore.resume_from_crash", true);
defaultPref("browser.sessionstore.restore_on_demand", true);

// ── Keep logins after shutdown ──
pref("privacy.sanitize.sanitizeOnShutdown", false);
pref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
pref("privacy.clearOnShutdown_v2.cache", false);

// ── Tab Behavior ──
defaultPref("browser.tabs.warnOnClose", true);
defaultPref("browser.tabs.warnOnCloseOtherTabs", true);
defaultPref("browser.tabs.warnOnQuit", true);
defaultPref("browser.ctrlTab.recentlyUsedOrder", true);

// ── Vertical Tabs (Firefox 136+) ──
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.primaryPanelWidth", 300);

// ── Disable Container Tabs ──
defaultPref("privacy.userContext.enabled", false);
defaultPref("privacy.userContext.ui.enabled", false);

// ── Fonts ──
defaultPref("font.name.serif.x-unicode", "Ubuntu");
defaultPref("font.name.sans-serif.x-unicode", "Ubuntu");
defaultPref("font.name.monospace.x-unicode", "Ubuntu Mono");
defaultPref("font.default.x-unicode", "sans-serif");

// ── Telemetry / data collection (Floorp default is off) ──
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);