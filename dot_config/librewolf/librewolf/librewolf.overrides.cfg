// ── Performance (i5-1145G7 11th gen / 16GB RAM) ──

defaultPref("dom.ipc.processCount", 6);                              // Content processes (default is 8 on 16GB; 6 keeps headroom)
defaultPref("browser.tabs.unloadOnLowMemory", false);                // 16GB is plenty - don't unload tabs under memory pressure
defaultPref("browser.cache.memory.capacity", 1048576);               // 1GB memory cache (matches Firefox default for 16GB)
defaultPref("image.mem.surfacecache_max_size_kb", 524288);           // 512MB image cache
defaultPref("browser.cache.disk.capacity", 358400);                  // ~350MB disk cache (Firefox default)
defaultPref("browser.sessionhistory.max_entries", 20);               // Allow more back/forward history per tab
defaultPref("browser.contentSettings.cache.enabled", false);         // Aggressive tab discarding
defaultPref("dom.serviceWorkers.parentInterception", false);         // Limit DOM workers
defaultPref("media.autoplay.default", 5);                            // Block autoplay
defaultPref("general.smoothScroll", false);                          // Disable smooth scrolling

// ── VA-API hardware video decoding (Iris Xe / iHD driver) ──
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.ffmpeg.vaapi.enabled", true);
defaultPref("media.av1.enabled", true);                              // 1145G7 has hardware AV1 decode

// ── Session Restore ──
defaultPref("browser.sessionstore.resume_from_crash", true);
defaultPref("browser.sessionstore.restore_on_demand", true);         // Restore tabs lazily (click to load)

// ── Keep logins after shutdown (prevent logouts on reboot/update) ──
pref("privacy.sanitize.sanitizeOnShutdown", false);
pref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
pref("privacy.clearOnShutdown_v2.cache", false);

// ── Tab Behavior ──
defaultPref("browser.tabs.warnOnClose", true);                       // Ask before closing multiple tabs
defaultPref("browser.tabs.warnOnCloseOtherTabs", true);
defaultPref("browser.tabs.warnOnQuit", true);
defaultPref("browser.ctrlTab.recentlyUsedOrder", true);              // Ctrl+Tab cycles in MRU order

// ── Vertical Tabs ──
// Requires Firefox ≥ 136 / LibreWolf ≥ 152. Toggle sidebar with Ctrl+B.
defaultPref("sidebar.verticalTabs", true);
defaultPref("sidebar.primaryPanelWidth", 300);

// ── Disable Container Tabs ──
defaultPref("privacy.userContext.enabled", false);
defaultPref("privacy.userContext.ui.enabled", false);

// ── Fonts ──
defaultPref("font.name.serif.x-unicode", "Ubuntu");
defaultPref("font.name.sans-serif.x-unicode", "Ubuntu");
defaultPref("font.name.monospace.x-unicode", "Ubuntu Mono");
defaultPref("font.default.x-unicode", "sans-serif");

// ── Language / Spell Check ──
// Install dictionaries manually:
//   https://addons.mozilla.org/search/?q=arabic+dictionary
//   https://addons.mozilla.org/search/?q=french+dictionary
//   https://addons.mozilla.org/search/?q=german+dictionary
defaultPref("spellchecker.dictionary", "en-US");

// ── WebGL ──
defaultPref("webgl.disabled", false);
defaultPref("webgl.force-enabled", true);
