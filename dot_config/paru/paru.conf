[options]
# Print packages from bottom to top so the #1 choice sits right above your prompt
BottomUp

# Merge official CachyOS/Arch repo updates and AUR updates into one unified list
CombinedUpgrade

# Show an interactive numbered menu before upgrading so you can easily skip specific packages
UpgradeMenu

# Automatically fetch missing PGP keys required by AUR PKGBUILDs
PgpFetch

# Look for AUR packages that satisfy dependencies
Provides

# Keep sudo alive in the background during long compilations
SudoLoop

# Delete untracked build artifacts/src directories after installation to save SSD space
CleanAfter

# Compile everything inside the package first, then prompt to install all at once at the end
BatchInstall

# Track updates for -git/-svn development packages
# (Comment out '#Devel' if -git packages ever trigger false downgrade/rebuild loops)
Devel
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil

# Keep Chroot commented out unless you manually maintain a devtools chroot
#Chroot

# Uncomment SkipReview ONLY if you want to completely bypass viewing PKGBUILD diffs
#SkipReview

[bin]
# Syntax-highlighted PKGBUILD review (requires 'bat' to be installed: sudo pacman -S bat)
Pager = bat
